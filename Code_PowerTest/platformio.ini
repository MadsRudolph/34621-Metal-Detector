; PlatformIO Project Configuration File
; DTU 34621 - VLF Metal Detector (Power Test)
; Target: Arduino Nano (ATmega328P) ONLY
;
; ÆNDRING: Fjernet Arduino Mega support - kun Nano
;
; BARE METAL BUILD - No Arduino framework
; Uses only avr-libc for minimal code size and full register access
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 9600

; ============================================================
; FJERNET: ATmega2560 (Mega) support
; ============================================================
; ORIGINAL KODE havde:
;   [env:mega2560]
;   board = megaatmega2560
;
; HVORFOR FJERNET:
; - Projektet er migreret til Arduino Nano
; - Mega hardware bruges ikke længere
; ============================================================

[env:nano]
platform = atmelavr
board = nanoatmega328
; No framework = bare metal with avr-libc only

; CPU frequency
board_build.f_cpu = 16000000L

; Source files include drivers
build_src_filter =
    +<*.c>
    +<drivers/*.c>

build_flags =
    -Os
    -Wall
    -Wextra
    -Wno-unused-parameter
    -std=c99
    -ffunction-sections
    -fdata-sections
    -Isrc/drivers

build_unflags =
    -std=gnu++11
    -std=gnu++14

; Serial monitor settings
monitor_speed = 9600
monitor_filters = colorize

; Upload settings for Nano
upload_speed = 115200
upload_protocol = arduino

; No external library dependencies
lib_deps =

; Build type: release for size optimization
build_type = release
