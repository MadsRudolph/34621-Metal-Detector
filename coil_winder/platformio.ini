; PlatformIO Configuration for Coil Winder Controller
; Embedded C for Arduino UNO (ATmega328P)

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno

; No Arduino framework - pure AVR-libc
framework =

; Compiler flags for embedded C
build_flags =
    -std=c99
    -Os
    -Wall
    -Wextra
    -ffunction-sections
    -fdata-sections

; Linker flags
build_unflags =

; Upload via Arduino bootloader
upload_protocol = arduino
upload_speed = 115200
; upload_port = COM11  ; uncomment and set if auto-detect fails

; Serial monitor (for debugging if needed)
monitor_speed = 115200
