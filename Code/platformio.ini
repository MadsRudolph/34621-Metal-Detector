; PlatformIO Project Configuration File
; DTU 34621 - VLF Metal Detector
; Target: Arduino Nano (ATmega328P) ONLY
;
; ÆNDRING: Fjernet Arduino Mega support - kun Nano
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

; ============================================================
; FJERNET: Multi-board support
; ============================================================
; ORIGINAL KODE havde:
;   [env:mega]
;   board = megaatmega2560
;   ...
;   [env:nano]
;   board = nanoatmega328
;
; HVORFOR FJERNET:
; - Projektet er migreret til Arduino Nano
; - Simplere konfiguration med kun ét target
; - Ingen forvirring om hvilken board der bruges
; ============================================================

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

; CPU frequency (16 MHz)
board_build.f_cpu = 16000000L

; Build flags
build_flags =
    -std=c99
    -I src
    -I src/signal
    -I src/app
    -I src/drivers
    -Wall
    -Os

; Source file filter
build_src_filter =
    +<*.c>
    +<signal/*.c>
    +<app/*.c>
    +<drivers/*.c>

; Serial monitor settings
monitor_speed = 115200
monitor_filters = colorize

; Upload settings for Nano
upload_speed = 115200
upload_protocol = arduino

; Build type (release optimized)
build_type = release

; No library dependencies (pure AVR libc)
lib_deps =
