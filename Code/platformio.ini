; PlatformIO Project Configuration File
; DTU 34621 - VLF Metal Detector
; Supports: Arduino Mega 2560 (ATmega2560) and Arduino Nano (ATmega328P)
; Style: Bare metal C (no Arduino framework functions used)
;
; Build: pio run -e mega   OR   pio run -e nano
; Upload: pio run -e mega -t upload   OR   pio run -e nano -t upload
; Monitor: pio device monitor

; ============================================================
; Common settings for all environments
; ============================================================
[env]
platform = atmelavr
framework = arduino

; CPU frequency (16 MHz)
board_build.f_cpu = 16000000L

; Build flags
build_flags =
    -std=c99
    -I src
    -I src/signal
    -I src/app
    -I src/drivers
    -Wall
    -Os

; Source file filter (bare metal - no hal)
build_src_filter =
    +<*.c>
    +<signal/*.c>
    +<app/*.c>
    +<drivers/*.c>

; Serial monitor settings
monitor_speed = 115200
monitor_filters = colorize

; Build type (release optimized)
build_type = release

; Library dependencies (none - pure AVR libc)
lib_deps =

; ============================================================
; Arduino Mega 2560 (ATmega2560)
; ============================================================
[env:mega]
board = megaatmega2560

; Upload settings for Mega
upload_speed = 115200
upload_protocol = wiring

; ============================================================
; Arduino Nano (ATmega328P)
; ============================================================
[env:nano]
board = nanoatmega328

; Upload settings for Nano (old bootloader uses 57600)
upload_speed = 115200
upload_protocol = arduino

; Nano with old bootloader (if upload fails, try this)
[env:nano_old]
board = nanoatmega328
board_upload.speed = 57600
upload_protocol = arduino
