; PlatformIO Project Configuration File
; DTU 34621 - VLF Metal Detector
; Target: Arduino Mega 2560 (ATmega2560)
; Style: Bare metal C (no Arduino framework functions used)
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino

; CPU frequency (16 MHz)
board_build.f_cpu = 16000000L

; Build flags
build_flags =
    -std=c99
    -I src
    -I src/signal
    -I src/app
    -I src/drivers
    -Wall
    -Os

; Source file filter (bare metal - no hal)
build_src_filter =
    +<*.c>
    +<signal/*.c>
    +<app/*.c>
    +<drivers/*.c>

; Serial monitor settings
monitor_speed = 115200
monitor_filters = colorize

; Upload settings
upload_speed = 115200
upload_protocol = wiring

; Library dependencies (none - pure AVR libc)
lib_deps =

; Build type (release optimized)
build_type = release
